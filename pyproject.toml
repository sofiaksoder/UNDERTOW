[project]
name = "pfvol"
version = "0.1.0"
description = "Bootstrap particle filter for stochastic volatility"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
analysis = ["pandas", "matplotlib", "yfinance", "arch"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pfvol"]
